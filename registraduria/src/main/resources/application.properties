# ============================================================================
# Configuracion de la Registraduria — taller de seguridad
# ============================================================================

registry.jdbc-url=jdbc:h2:mem:regdb;DB_CLOSE_DELAY=-1

# --- Superficie expuesta -----------------------------------------------------
# Actuator trae 15 endpoints. Por defecto solo publica /health e /info por HTTP,
# pero basta con que alguien escriba "*" una vez (copiando de un tutorial) para
# exponer /env, /heapdump y /configprops, que revelan variables de entorno,
# la memoria del proceso y la configuracion completa.
#
# Se declara la lista explicita, aunque coincida con el default, porque un
# default silencioso no protege de nada: protege la INTENCION escrita, que
# ademas se puede revisar en un pull request.
management.endpoints.web.exposure.include=health,info

# No revelar el detalle del healthcheck a un anonimo: que servicios hay detras,
# que base de datos, que version. Es reconocimiento gratis para un atacante.
management.endpoint.health.show-details=never

# --- Respuestas de error -----------------------------------------------------
# Nunca devolver la traza de la excepcion ni el mensaje interno al cliente.
# Un stack trace nombra clases, rutas, versiones de librerias y a veces
# fragmentos de la consulta SQL. Todo eso reduce el trabajo del atacante.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never

# --- Cabeceras ---------------------------------------------------------------
# No anunciar el servidor ni su version en cada respuesta.
server.error.whitelabel.enabled=false
